name: Android device library

on:
  pull_request:
    paths:
      - 'android/**'
      - '.github/workflows/android-agent.yml'
  push:
    branches: [master]
    paths:
      - 'android/**'
      - '.github/workflows/android-agent.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-library:
    name: Assemble and unit-test Android device library
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android compile platform
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Compile production library and run JVM unit tests
        working-directory: android
        run: gradle --no-daemon --stacktrace :agent:assembleDebug :agent:testDebugUnitTest
